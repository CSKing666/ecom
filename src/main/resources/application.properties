spring.application.name=EcomUsingRestAPI

# Credentials come from the environment (see ~/.mysql-app.env) so that no
# password lives in a file that could be committed.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ecom
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
